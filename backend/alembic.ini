# ---------------------------------------------------------------------------
# Alembic configuration.
# NOTE: keep this file ASCII-only; alembic reads it with the system locale
# codec, which is GBK on zh-CN Windows and may fail on non-ASCII bytes.
#
#   alembic revision --autogenerate -m "description"
#   alembic upgrade head
#   alembic downgrade -1
#
# The database URL is NOT hardcoded here: alembic/env.py loads it from
# backend/.env (DATABASE_URL) through app.core.config.settings.
# ---------------------------------------------------------------------------
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S